<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>КРОВЬ — LoL Dashboard</title>
  <meta name="description" content="Дашборд команды по League of Legends: рейтинг, чемпионы, инсайты, тренировки.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div class="brand">
        <svg class="logo" viewBox="0 0 48 56" aria-hidden="true"><path d="M24 2 4 10v18c0 14 9 22 20 26 11-4 20-12 20-26V10z" fill="#2a0d14" stroke="#e84057" stroke-width="2.5"/><path d="M24 14c-5 8-9 13-9 19a9 9 0 0 0 18 0c0-6-4-11-9-19z" fill="#e84057"/></svg>
        <div>
          <h1 id="teamName">КРОВЬ</h1>
          <p class="sub" id="teamSub"></p>
        </div>
      </div>
      <div class="rating" id="teamRating"></div>
    </div>
  </header>
  <div class="navbar">
    <nav class="wrap nav" id="nav">
      <a href="#roster" class="active">Состав</a>
      <a href="#champions">Чемпионы</a>
      <a href="#insights">Инсайты</a>
      <a href="#training">Тренировки</a>
    </nav>
  </div>

  <main class="wrap">
    <section id="roster"><h2>Состав</h2><div class="roster" id="rosterGrid"></div></section>

    <section class="two">
      <div class="card" id="best">
        <h2>Кто играет лучше</h2>
        <div class="table-wrap"><table id="leaderboard"></table></div>
      </div>
      <div class="card" id="bestAt"><h2>Лучший в…</h2><div id="bestAtList"></div></div>
    </section>

    <section id="champions">
      <h2>Чемпионы</h2>
      <div class="two eq">
        <div class="card"><h3>Чемпионы команды (топ 8)</h3><div class="table-wrap"><table id="teamChamps"></table></div></div>
        <div class="card"><div class="tabs" id="playerTabs" role="tablist"></div><h3 id="playerChampsTitle"></h3><div class="table-wrap"><table id="playerChamps"></table></div></div>
      </div>
    </section>

    <section id="stats">
      <h2>Командная статистика</h2>
      <div class="card stats">
        <div>
          <div class="tiles" id="tiles"></div>
          <h3>Последние 20 игр</h3>
          <div class="form" id="formStrip"></div>
        </div>
        <div>
          <h3>Контроль объектов <span class="muted">(винрейт команды)</span></h3>
          <div id="objectives"></div>
        </div>
      </div>
    </section>

    <section id="insights"><h2>Инсайты</h2><div class="insights" id="insightList"></div></section>

    <section id="training">
      <h2>План тренировок</h2>
      <div class="training">
        <div class="focus" id="focus"></div>
        <div class="card"><h3>Ближайшие сессии</h3><div class="table-wrap"><table id="sessions"></table></div><a class="seeall" href="training.html">Весь план тренировок →</a></div>
        <div class="card"><h3>Цели недели</h3><div id="goals"></div></div>
      </div>
    </section>
  </main>


  <script src="app.js"></script>
</body>
</html>
