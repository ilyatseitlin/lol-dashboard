<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>КРОВЬ — LoL Dashboard</title>
  <meta name="description" content="Дашборд команды по League of Legends: рейтинг, чемпионы, инсайты, тренировки.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="КРОВЬ">
  <meta property="og:title" content="КРОВЬ — дашборд команды по League of Legends">
  <meta property="og:description" content="Рейтинг игроков и команды, чемпионы, инсайты и план тренировок.">
  <meta property="og:url" content="https://ilyatseitlin.github.io/lol-dashboard/">
  <meta property="og:image" content="https://ilyatseitlin.github.io/lol-dashboard/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="КРОВЬ — дашборд команды по League of Legends">
  <meta name="twitter:description" content="Рейтинг игроков и команды, чемпионы, инсайты и план тренировок.">
  <meta name="twitter:image" content="https://ilyatseitlin.github.io/lol-dashboard/assets/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div class="brand">
        <img class="logo" src="assets/logo.png" alt="КРОВЬ" width="40" height="52">
        <div>
          <h1 id="teamName">КРОВЬ</h1>
          <p class="sub" id="teamSub"></p>
        </div>
      </div>
      <div class="rating" id="teamRating"></div>
    </div>
  </header>
  <div class="navbar">
    <div class="wrap navrow">
    <nav class="nav" id="nav">
      <a href="#roster" class="active">Состав</a>
      <a href="#champions">Чемпионы</a>
      <a href="#insights">Инсайты</a>
      <a href="#training">Тренировки</a>
    </nav>
    <a class="cta" href="https://docs.google.com/forms/d/e/1FAIpQLSdPCbQIXbLGoPQH2pjnCEnYtO3VKyBLyV8HiTt50E5QpP1sCw/viewform" target="_blank" rel="noopener">Предложить<span class="long"> улучшение</span></a>
    </div>
  </div>

  <main class="wrap">
    <section id="roster"><h2>Состав</h2><div class="roster" id="rosterGrid"></div></section>

    <section class="two">
      <div class="card" id="best">
        <h2>Кто играет лучше</h2>
        <div class="table-wrap"><table id="leaderboard"></table></div>
      </div>
      <div class="card" id="bestAt"><h2>Лучший в…</h2><div id="bestAtList"></div></div>
    </section>

    <section id="champions">
      <h2>Чемпионы</h2>
      <div class="two eq">
        <div class="card"><h3>Чемпионы команды (топ 8)</h3><div class="table-wrap"><table id="teamChamps"></table></div></div>
        <div class="card"><div class="tabs" id="playerTabs" role="tablist"></div><h3 id="playerChampsTitle"></h3><div class="table-wrap"><table id="playerChamps"></table></div></div>
      </div>
    </section>

    <section id="stats">
      <h2>Командная статистика</h2>
      <div class="card stats">
        <div>
          <div class="tiles" id="tiles"></div>
          <h3>Последние 20 игр</h3>
          <div class="form" id="formStrip"></div>
        </div>
        <div>
          <h3>Контроль объектов <span class="muted">(винрейт команды)</span></h3>
          <div id="objectives"></div>
        </div>
      </div>
    </section>

    <section id="insights"><h2>Инсайты</h2><div class="insights" id="insightList"></div></section>

    <section id="training">
      <h2>План тренировок</h2>
      <div class="training">
        <div class="focus" id="focus"></div>
        <div class="card"><h3>Ближайшие сессии</h3><div class="table-wrap"><table id="sessions"></table></div><a class="seeall" href="training.html">Весь план тренировок →</a></div>
        <div class="card"><h3>Цели недели</h3><div id="goals"></div></div>
      </div>
    </section>
  </main>


  <script src="app.js"></script>
</body>
</html>
